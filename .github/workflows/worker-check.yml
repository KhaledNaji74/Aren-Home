name: Worker checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, autonomy/visible-cycle-monitoring]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Validate Wrangler configuration
        run: node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc', 'utf8')); console.log('wrangler.jsonc is valid JSON')"
